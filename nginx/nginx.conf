# Quick Aid - nginx reverse proxy / TLS termination.
#
# gunicorn (the `web` service) only speaks plain HTTP and is not published
# to the host directly - this is the only thing that terminates TLS and
# is exposed on 80/443. It forwards to `web:5000` over the private
# docker-compose network and sets the X-Forwarded-* headers the app reads
# (via werkzeug's ProxyFix, enabled with BEHIND_PROXY=True) to recover the
# real client IP/scheme for rate limiting, secure cookies, and generated
# links.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Match the app's own MAX_CONTENT_LENGTH (16MB) plus headroom for
    # multipart/form-data overhead, so nginx doesn't reject uploads before
    # Flask gets a chance to validate them.
    client_max_body_size 20M;

    upstream quickaid_app {
        server web:5000;
    }

    # Plain HTTP: only used to redirect to HTTPS and to serve ACME
    # HTTP-01 challenges if you're using certbot for real certificates.
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            proxy_pass http://quickaid_app;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }
    }
}

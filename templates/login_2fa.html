<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Verification - Quick Aid</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #0f172a;
        }
        .auth-card {
            background: rgba(255,255,255,0.92);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
        }
        .auth-card h1 { font-size: 1.4em; margin-bottom: 6px; }
        .auth-card p { color: #64748b; margin-bottom: 22px; font-size: 0.9em; }
        form { text-align: left; }
        input#code {
            width: 100%; padding: 14px; margin-bottom: 18px; border-radius: 10px;
            border: 1px solid #cbd5e1; font-size: 1.4em; font-family: inherit;
            letter-spacing: 0.4em; text-align: center;
        }
        input#code:focus { outline: none; border-color: #0ea5e9; }
        button {
            width: 100%; padding: 13px; border: none; border-radius: 10px;
            background: linear-gradient(135deg, #0ea5e9, #7c3aed); color: #fff;
            font-size: 1em; font-weight: 600; cursor: pointer; transition: filter 0.15s ease;
        }
        button:hover { filter: brightness(1.08); }
        .error-box {
            background: #fee2e2; color: #b91c1c; padding: 10px 14px; border-radius: 10px;
            font-size: 0.85em; margin-bottom: 18px; text-align: left;
        }
        .back-link { display: block; text-align: center; margin-top: 18px; font-size: 0.85em; color: #94a3b8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>🔐 Enter your 2FA code</h1>
        <p>Open your authenticator app and enter the 6-digit code for Quick Aid.</p>

        {% if error %}
        <div class="error-box">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]*"
                   maxlength="6" autocomplete="one-time-code" required autofocus placeholder="000000">
            <button type="submit">Verify</button>
        </form>
        <a class="back-link" href="/login">← Back to login</a>
    </div>
</body>
</html>

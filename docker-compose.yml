# Quick Aid - local/production compose setup.
#
# Usage:
#   1. cp .env.example .env   (fill in real GEMINI_API_KEY and SECRET_KEY)
#   2. docker compose up --build
#   3. Open http://localhost:5000
#
# The SQLite database and logs persist across restarts/rebuilds via the
# named volumes below - `docker compose down` alone won't lose your data;
# only `docker compose down -v` removes the volumes too.

services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      PORT: "5000"
    volumes:
      - quickaid-data:/app/data
      - quickaid-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  quickaid-data:
  quickaid-logs:

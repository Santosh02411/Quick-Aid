name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, even with no code changes, so newly-disclosed CVEs in
    # pinned dependencies still get caught.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Database migrations apply cleanly to a new database
        run: DATABASE_PATH=/tmp/ci-migrate.db python -m quickaid.core.migrations upgrade && DATABASE_PATH=/tmp/ci-migrate.db python -m quickaid.core.migrations check

      - name: Evaluation datasets match their recorded versions
        run: python evaluation/manage_datasets.py check

      - name: Safety evaluation (fails if a safety threshold is missed)
        run: python evaluation/run_evaluation.py --weak-model --no-write

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt --strict
